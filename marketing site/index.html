<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revelio - Tu Editor AI</title>
    <link rel="icon" type="image/jpeg" href="img/revelio.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="logo-header">
            <img src="img/revelio.jpg" alt="Revelio Logo" class="logo-img">
            <span class="logo-text">Revelio</span>

            <h1 class="headline">Manda tu foto. Recibe magia. ✨</h1>
            <p class="subheadline">Transfórmala en caricatura, óleo, LEGO, estilo cine y más—todo por WhatsApp en segundos.</p>
            
            <div class="polaroid-showcase">
                <div class="polaroid before">
                    <div class="frame">
                        <img id="img-before" src="img/oilbefore.jpeg" alt="Original Photo">
                        <div class="caption">Antes</div>
                    </div>
                </div>
                
                <div class="magic-wand">
                    <span class="sparkles">✨</span>
                    <!-- Hand-drawn style loop arrow -->
                    
                </div>

                <div class="polaroid after">
                    <div class="frame">
                        <img id="img-after" src="img/oilafter.jpeg" alt="AI Edited Photo">
                        <div class="caption">Después</div>
                    </div>
                </div>
            </div>
