<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revelio - Oil Painting</title>
    <link rel="icon" type="image/jpeg" href="img/revelio.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
    </div>
    <div class="main-container">
        <header>
            <div class="header-profile">
                <img src="img/revelio.jpg" alt="Revelio Logo" class="profile-pic">
            </div>
            <div class="header-info">
                <div class="header-name">Revelio</div>
            </div>
        </header>

        <main class="chat-interface">
            <div class="chat-container" id="chat-container">
                <!-- Messages will be injected here by JS -->
            </div>
        </main>

        <div class="cta-container" id="cta-container">
            <a href="https://wa.me/12029182106?text=Hola!%20Quisiera%20editar%20mi%20foto!" class="whatsapp-btn" target="_blank">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.472 14.382C17.115 14.323 16.758 14.263 16.4 14.204C16.043 14.145 15.686 14.086 15.329 14.027C15.052 13.981 14.781 14.104 14.614 14.333L13.793 15.463C13.729 15.551 13.627 15.609 13.518 15.616C13.409 15.623 13.3 15.578 13.225 15.496C12.129 14.294 11.185 12.996 10.408 11.603C10.353 11.504 10.359 11.383 10.422 11.291L11.289 10.012C11.46 9.76 11.492 9.438 11.372 9.156C11.217 8.794 11.062 8.431 10.907 8.069C10.752 7.706 10.597 7.344 10.442 6.981C10.322 6.701 10.025 6.545 9.727 6.605C9.367 6.677 9.007 6.749 8.647 6.821C8.287 6.893 7.927 6.965 7.567 7.037C7.272 7.096 7.042 7.326 6.983 7.621C6.889 8.095 6.834 8.576 6.82 9.059C6.82 9.059 6.82 9.06 6.82 9.061C6.845 13.584 10.416 17.155 14.939 17.18C14.94 17.18 14.941 17.18 14.942 17.18C15.425 17.166 15.905 17.111 16.379 17.017C16.674 16.958 16.904 16.728 16.963 16.433C17.035 16.073 17.107 15.713 17.179 15.353C17.251 14.993 17.323 14.633 17.395 14.273C17.455 13.975 17.299 13.678 17.019 13.558C17.019 13.558 17.246 14.091 17.472 14.382ZM12 21.75C6.615 21.75 2.25 17.385 2.25 12C2.25 6.615 6.615 2.25 12 2.25C17.385 2.25 21.75 6.615 21.75 12C21.75 17.385 17.385 21.75 12 21.75Z" fill="white"/>
                </svg>
                Edita tu foto ahora en WhatsApp!
            </a>
        </div>
    </div>

    <template id="msg-template">
        <div class="message">
            <div class="message-content"></div>
            <div class="message-time"></div>
        </div>
    </template>

    <template id="img-template">
        <div class="message">
            <div class="image-content">
                <img src="" alt="User uploaded image">
            </div>
            <div class="message-time"></div>
        </div>
    </template>

    <template id="typing-template">
        <div class="message bot typing">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </template>

    <script src="script-oil.js"></script>
</body>
</html>
